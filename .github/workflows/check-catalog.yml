name: Check catalog

on:
  push:
    branches: [verified]
  pull_request:
    branches: [verified]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python tools/cloud_catalog.py --check
