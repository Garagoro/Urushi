name: CI / Auto-Build

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
    paths-ignore:
      - 'dist/**'
      - 'docs/**'
      - '*.md'
      - '.github/workflows/discord-release.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release (x64 MSVC)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure CMake
        shell: cmd
        run: cmake -B build -A x64

      - name: Build Project
        shell: cmd
        run: cmake --build build --config Release --parallel

      - name: Stage Dist Binaries & Version Manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = $PWD.Path
          $distDir = Join-Path $root "dist"
          New-Item -ItemType Directory -Force $distDir | Out-Null

          Copy-Item (Join-Path $root "build\core\Release\urushi.dll") (Join-Path $distDir "urushi.dll") -Force
          Copy-Item (Join-Path $root "build\proxy\Release\version.dll") (Join-Path $distDir "version.dll") -Force

          # Calculate PE timestamp for updater version comparison
          $dllPath = Join-Path $distDir "urushi.dll"
          $bytes = [System.IO.File]::ReadAllBytes($dllPath)
          $peOff = [BitConverter]::ToInt32($bytes, 60)
          $linkTime = [BitConverter]::ToUInt32($bytes, $peOff + 8)

          $ver = "1.2.0"
          if ($env:GITHUB_REF_TYPE -eq "tag" -or $env:GITHUB_REF -like "refs/tags/*") {
              $ver = ($env:GITHUB_REF -replace '^refs/tags/v?', '')
          } elseif (Test-Path "dist/version.txt") {
              $m = Get-Content "dist/version.txt" | Select-String "^version=(.+)"
              if ($m) { $ver = $m.Matches[0].Groups[1].Value.Trim() }
          }
          $notes = "Automated release build v${ver}: dynamic sigscans, C++ UI introspection, auto-persistence and live auto-updater"
          $manifest = @(
              "version=$ver"
              "link_time=$linkTime"
              "notes=$notes"
          ) -join "`n"

          $manifestPath = Join-Path $distDir "version.txt"
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($manifestPath, "$manifest`n", $utf8NoBom)

          Write-Host "Staged dist/: link_time=$linkTime, version=$ver"

      - name: Package Release ZIP
        shell: pwsh
        run: |
          $ver = "1.2.0"
          if ($env:GITHUB_REF_TYPE -eq "tag" -or $env:GITHUB_REF -like "refs/tags/*") {
              $ver = ($env:GITHUB_REF -replace '^refs/tags/v?', '')
          } elseif (Test-Path "dist/version.txt") {
              $m = Get-Content "dist/version.txt" | Select-String "^version=(.+)"
              if ($m) { $ver = $m.Matches[0].Groups[1].Value.Trim() }
          }
          $root = $PWD.Path
          $distDir = Join-Path $root "dist"
          $pkgDir = Join-Path $root "Urushi-v$ver"
          New-Item -ItemType Directory -Force $pkgDir | Out-Null

          Copy-Item (Join-Path $distDir "version.dll") $pkgDir -Force
          Copy-Item (Join-Path $distDir "urushi.dll") $pkgDir -Force
          Copy-Item -Path (Join-Path $root "scripts") -Destination $pkgDir -Recurse -Force
          Copy-Item -Path (Join-Path $root "shaders") -Destination $pkgDir -Recurse -Force
          Copy-Item (Join-Path $distDir "version.txt") $pkgDir -Force
          Copy-Item (Join-Path $root "README.md") $pkgDir -Force
          Copy-Item (Join-Path $root "LICENSE") $pkgDir -Force

          $zipVer = Join-Path $root "Urushi-v$ver.zip"
          $zipLatest = Join-Path $root "Urushi-latest.zip"
          Compress-Archive -Path "$pkgDir/*" -DestinationPath $zipVer -Force
          Copy-Item $zipVer $zipLatest -Force
          Write-Host "Packaged $zipVer and $zipLatest successfully"

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Urushi-Artifacts
          path: |
            *.log
            Urushi-*.zip
            dist/version.dll
            dist/urushi.dll
            dist/version.txt

      - name: Commit and Push Dist Binaries
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          $diff = git status --porcelain dist/
          if ($diff) {
              Write-Host "Changes detected in dist/:"
              Write-Host $diff
              git commit -m "chore(dist): auto-build release binaries v1.1.0 [skip ci]"
              git push origin main
          } else {
              Write-Host "No changes in dist/ to commit."
          }

      - name: Publish GitHub Release
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = "1.2.0"
          if ($env:GITHUB_REF_TYPE -eq "tag" -or $env:GITHUB_REF -like "refs/tags/*") {
              $ver = ($env:GITHUB_REF -replace '^refs/tags/v?', '')
          } elseif (Test-Path "dist/version.txt") {
              $m = Get-Content "dist/version.txt" | Select-String "^version=(.+)"
              if ($m) { $ver = $m.Matches[0].Groups[1].Value.Trim() }
          }
          $tag = "v$ver"
          $root = $PWD.Path
          $distDir = Join-Path $root "dist"
          $zipVer = Join-Path $root "Urushi-$tag.zip"
          $zipLatest = Join-Path $root "Urushi-latest.zip"
          $dllUrushi = Join-Path $distDir "urushi.dll"
          $dllProxy = Join-Path $distDir "version.dll"

          $title = "$tag — C++ UI Introspection, Auto-Persistence and Reinject"
          $notes = @(
              "### 🏎️ Features & Changes in ${tag}:"
              "- 🧠 **C++ UI Element Introspection & Registry**: UI elements (toggles, sliders, combos, text fields) declared by Lua scripts are automatically identified, registered, and introspected by the C++ core."
              "- 💾 **Universal Auto-Persistence**: Full bi-directional persistence — settings are restored into the C++ UI on startup and automatically saved back to urushi_data/config.json whenever changed."
              "- ⚡ **Dynamic Signature Scanning**: All critical game engine and Unity RVA offsets (Transform cluster, raycasts, engine tick) are dynamically resolved via signature scans to survive game updates."
              "- 🎨 **CarFX Shaders & Materials**: Dynamic livery shaders (Holo, Tandem Angle, Chams) with automatic directory watcher."
              "- 🔄 **Live Hot-Reinject**: Zero-downtime updates — urushi.dll hot-reloads live inside the running game process via version.dll event."
              "- ⌨️ **Dynamic Keybinds Hub**: Dedicated Keybinds window aggregating all actions by active mod without hardcoded layouts."
              "- 📦 **Automated CI/CD**: Automatic builds, release packaging, and live in-game auto-updater."
          ) -join "`n"

          $exists = $false
          try {
              gh release view $tag 2>$null | Out-Null
              if ($LASTEXITCODE -eq 0) { $exists = $true }
          } catch {}

          if ($exists) {
              Write-Host "Updating release $tag assets..."
              gh release upload $tag $zipVer $zipLatest $dllUrushi $dllProxy --clobber
              gh release edit $tag --title $title --notes $notes
          } else {
              Write-Host "Creating new GitHub Release $tag..."
              gh release create $tag $zipVer $zipLatest $dllUrushi $dllProxy --title $title --notes $notes --latest
          }

      - name: Send Discord Release Notification
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if (-not $env:DISCORD_WEBHOOK) {
              Write-Host "DISCORD_WEBHOOK secret not found, skipping Discord notification."
              exit 0
          }

          $ver = "1.2.0"
          if ($env:GITHUB_REF_TYPE -eq "tag" -or $env:GITHUB_REF -like "refs/tags/*") {
              $ver = ($env:GITHUB_REF -replace '^refs/tags/v?', '')
          } elseif (Test-Path "dist/version.txt") {
              $m = Get-Content "dist/version.txt" | Select-String "^version=(.+)"
              if ($m) { $ver = $m.Matches[0].Groups[1].Value.Trim() }
          }
          $tag = "v$ver"
          $title = "$tag — C++ UI Introspection, Auto-Persistence and Reinject"
          $relUrl = "https://github.com/Garagoro/Urushi/releases/tag/$tag"
          $dlUrl = "https://github.com/Garagoro/Urushi/releases/download/$tag/Urushi-$tag.zip"

          $pyScript = @"
          import os, json, urllib.request

          webhook = os.environ.get('DISCORD_WEBHOOK', '').strip()
          if not webhook:
              exit(0)

          tag = '$tag'
          title = '$title'
          url = '$relUrl'
          dl_url = '$dlUrl'

          desc = '''### 🏎️ Features & Changes in ''' + tag + ''':
          - 🧠 **C++ UI Element Introspection & Registry**: UI elements declared by Lua scripts are automatically identified, registered, and introspected by the C++ core.
          - 💾 **Universal Auto-Persistence**: Full bi-directional persistence — settings are restored into the C++ UI on startup and automatically saved back to `urushi_data/config.json`.
          - ⚡ **Dynamic Signature Scanning**: All critical game engine and Unity RVA offsets are dynamically resolved via signature scans to survive game updates.
          - 🎨 **CarFX Shaders & Materials**: Dynamic livery shaders (Holo, Tandem Angle, Chams) with automatic directory watcher.
          - 🔄 **Live Hot-Reinject**: Zero-downtime updates — `urushi.dll` hot-reloads live inside the running game process via `version.dll` event.
          - ⌨️ **Dynamic Keybinds Hub**: Dedicated Keybinds window aggregating all actions by active mod.
          - 📦 **Automated CI/CD**: Automatic builds, release packaging, and live in-game auto-updater.'''

          if len(desc) > 4000:
              desc = desc[:3997] + '...'

          payload = {
              'username': 'URUSHI Updates',
              'embeds': [
                  {
                      'title': f'🚀 New Release: {title}',
                      'url': url,
                      'color': 0x2ECC71,
                      'description': desc,
                      'fields': [
                          {'name': '🏷️ Version', 'value': f'`{tag}`', 'inline': True},
                          {'name': '⬇️ Download', 'value': f'[Urushi-{tag}.zip]({dl_url})', 'inline': True}
                      ],
                      'footer': {
                          'text': 'URUSHI • Auto-Update Suite',
                          'icon_url': 'https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png'
                      }
                  }
              ]
          }

          req = urllib.request.Request(
              webhook,
              data=json.dumps(payload).encode('utf-8'),
              headers={'Content-Type': 'application/json', 'User-Agent': 'DiscordBot (https://discord.com, 1.0.0)'}
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  print('Discord notification sent! Status:', resp.status)
          except Exception as e:
              print('Discord notification error:', e)
          "@

          python -c $pyScript
